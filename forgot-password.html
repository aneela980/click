<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b171b">
  <title>Capitaxio | Forgot Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b171b;
      --panel: #13252c;
      --green: #a5df43;
      --text: #f4f7fa;
      --muted: #9aadb5;
      --border: #304750;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1b3834 0%, transparent 48%), var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .wrapper { width: 100%; max-width: 430px; }
    .brand { text-align: center; margin-bottom: 26px; }

    .brand-icon {
      width: 60px; height: 60px; margin: 0 auto 13px;
      display: grid; place-items: center;
      border-radius: 18px;
      background: linear-gradient(145deg, #b7f45d, #76ad23);
      color: #102019; font-size: 28px; font-weight: 900;
    }

    .brand h1 { font-size: 29px; letter-spacing: 1px; }
    .brand h1 span { color: var(--green); }

    .card {
      padding: 30px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 20px 70px #00000035;
    }

    .card h2 { font-size: 23px; margin-bottom: 9px; }
    .card > p { color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 24px; }

    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 9px; }

    input {
      width: 100%; padding: 14px;
      border: 1px solid var(--border); border-radius: 10px;
      background: #0d1c22; color: var(--text);
      font-size: 15px; outline: none;
    }

    input:focus { border-color: var(--green); }
    input::placeholder { color: #71858d; }

    .submit-btn {
      width: 100%; margin-top: 20px; padding: 15px;
      border: none; border-radius: 10px;
      background: var(--green); color: #13210e;
      font-size: 16px; font-weight: 800; cursor: pointer;
    }

    .submit-btn:hover { background: #baf66a; }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

    #message { margin-top: 16px; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }

    .back {
      margin-top: 23px; padding-top: 21px;
      border-top: 1px solid var(--border);
      text-align: center; font-size: 14px;
    }

    a { color: var(--green); text-decoration: none; font-weight: bold; }
    footer { text-align: center; color: #72858d; font-size: 12px; margin-top: 22px; }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { padding: 23px 19px; }
    }
  </style>
</head>

<body>
  <main class="wrapper">

    <header class="brand">
      <div class="brand-icon" aria-hidden="true">C</div>
      <h1>Capita<span>xio</span></h1>
    </header>

    <section class="card">
      <h2>Forgot password?</h2>
      <p>Apni email likhein. Agar is email ka account maujood hua, to password badalne ka link bheja jayega.</p>

      <form id="forgotForm">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>

        <button type="submit" class="submit-btn" id="submitBtn">Send Reset Link</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>

      <div class="back">
        <a href="index.html">← Back to Login</a>
      </div>
    </section>

    <footer>&copy; 2026 Capitaxio. All rights reserved.</footer>
  </main>

  <script>
    const SUPABASE_URL = "https://zwffgoenruzcctkyptjg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6qL9pLwCjdfLAt6ftaSSTQ_SvWff4Ar";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const RESET_PAGE = "reset-password.html";

    const form = document.getElementById("forgotForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text, isError) {
      message.style.color = isError ? "#ff8b8b" : "#a5df43";
      message.textContent = text;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      // file:// se khola ho to email ka link wapas nahi aa sakta
      if (window.location.protocol === "file:") {
        showMessage("Is page ko VS Code ke Live Server (http://127.0.0.1:5500) se kholein. Seedhi file kholne par reset link kaam nahi karta.", true);
        return;
      }

      const folder = window.location.href.split("?")[0].split("#")[0];
      const redirectTo = folder.substring(0, folder.lastIndexOf("/") + 1) + RESET_PAGE;

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
      showMessage("", false);

      try {
        const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });

        const text = String((error && error.message) || "").toLowerCase();
        if (error && (text.includes("rate") || text.includes("seconds") || text.includes("limit"))) {
          showMessage("Bohat zyada koshishein ho gayin. Thori der baad dobara try karein.", true);
          return;
        }

        // Account ho ya na ho, jawab ek jaisa (taake koi email check na kar sake)
        showMessage("Agar ye email registered hai, to reset ka link bhej diya gaya hai. Inbox aur spam dono dekhein.", false);
        form.reset();
      } catch (err) {
        console.error(err);
        showMessage("Kuch masla aaya. Thori der baad dobara try karein.", true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
