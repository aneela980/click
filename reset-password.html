<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b171b">
  <title>Capitaxio | Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b171b;
      --panel: #13252c;
      --green: #a5df43;
      --text: #f4f7fa;
      --muted: #9aadb5;
      --border: #304750;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1b3834 0%, transparent 48%), var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .wrapper { width: 100%; max-width: 430px; }
    .brand { text-align: center; margin-bottom: 26px; }

    .brand-icon {
      width: 60px; height: 60px; margin: 0 auto 13px;
      display: grid; place-items: center;
      border-radius: 18px;
      background: linear-gradient(145deg, #b7f45d, #76ad23);
      color: #102019; font-size: 28px; font-weight: 900;
    }

    .brand h1 { font-size: 29px; letter-spacing: 1px; }
    .brand h1 span { color: var(--green); }

    .card {
      padding: 30px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 20px 70px #00000035;
    }

    .card h2 { font-size: 23px; margin-bottom: 9px; }
    .card > p { color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 24px; }

    .field { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 9px; }

    .pass-row { display: flex; gap: 8px; align-items: center; }

    input {
      width: 100%; padding: 14px;
      border: 1px solid var(--border); border-radius: 10px;
      background: #0d1c22; color: var(--text);
      font-size: 15px; outline: none;
    }

    input:focus { border-color: var(--green); }
    input::placeholder { color: #71858d; }

    .show-btn {
      padding: 13px 10px; color: var(--green);
      background: #1b323b; border: 1px solid var(--border);
      border-radius: 9px; cursor: pointer; font-size: 13px;
    }

    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

    .submit-btn {
      width: 100%; margin-top: 8px; padding: 15px;
      border: none; border-radius: 10px;
      background: var(--green); color: #13210e;
      font-size: 16px; font-weight: 800; cursor: pointer;
    }

    .submit-btn:hover { background: #baf66a; }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

    #message { margin-top: 16px; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }

    .back {
      margin-top: 23px; padding-top: 21px;
      border-top: 1px solid var(--border);
      text-align: center; font-size: 14px;
    }

    a { color: var(--green); text-decoration: none; font-weight: bold; }
    footer { text-align: center; color: #72858d; font-size: 12px; margin-top: 22px; }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { padding: 23px 19px; }
    }
  </style>
</head>

<body>
  <main class="wrapper">

    <header class="brand">
      <div class="brand-icon" aria-hidden="true">C</div>
      <h1>Capita<span>xio</span></h1>
    </header>

    <section class="card">
      <h2>Set new password</h2>
      <p id="intro">Link ki tasdeeq ho rahi hai...</p>

      <form id="resetForm" style="display:none">
        <div class="field">
          <label for="newPassword">New password</label>
          <div class="pass-row">
            <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="show-btn" data-target="newPassword">Show</button>
          </div>
          <p class="hint">Kam az kam 8 characters, jis mein harf aur number dono hon.</p>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="pass-row">
            <input type="password" id="confirmPassword" placeholder="Enter password again" autocomplete="new-password" minlength="8" required>
            <button type="button" class="show-btn" data-target="confirmPassword">Show</button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Update Password</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>

      <div class="back">
        <a href="index.html">← Back to Login</a>
      </div>
    </section>

    <footer>&copy; 2026 Capitaxio. All rights reserved.</footer>
  </main>

  <script>
    const SUPABASE_URL = "https://zwffgoenruzcctkyptjg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6qL9pLwCjdfLAt6ftaSSTQ_SvWff4Ar";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const intro = document.getElementById("intro");
    const submitBtn = document.getElementById("submitBtn");

    let recoveryReady = false;

    function showMessage(text, isError) {
      message.style.color = isError ? "#ff8b8b" : "#a5df43";
      message.textContent = text;
    }

    function enableForm() {
      recoveryReady = true;
      intro.textContent = "Apna naya password likhein.";
      form.style.display = "block";
    }

    document.querySelectorAll(".show-btn").forEach(function (button) {
      button.addEventListener("click", function () {
        const input = document.getElementById(button.dataset.target);
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        button.textContent = hidden ? "Hide" : "Show";
      });
    });

    // Email ke link se aane par Supabase khud recovery session bana deta hai
    db.auth.onAuthStateChange(function (event) {
      if (event === "PASSWORD_RECOVERY") enableForm();
    });

    // Agar event pehle hi guzar gaya ho, to session se pehchanein
    setTimeout(async function () {
      if (recoveryReady) return;

      const { data } = await db.auth.getSession();
      const fromLink = /type=recovery/.test(window.location.hash) || /type=recovery/.test(window.location.search);

      if (data.session && fromLink) {
        enableForm();
      } else if (!recoveryReady) {
        intro.textContent = "Ye link sahi nahi ya purana ho chuka hai.";
        showMessage("Dobara \"Forgot password\" se naya link mangwayen.", true);
      }
    }, 1500);

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const newPass = document.getElementById("newPassword").value;
      const confirmPass = document.getElementById("confirmPassword").value;

      if (newPass.length < 8 || !/[A-Za-z]/.test(newPass) || !/[0-9]/.test(newPass)) {
        showMessage("Password kam az kam 8 characters ka ho, aur harf aur number dono hon.", true);
        return;
      }

      if (newPass !== confirmPass) {
        showMessage("Dono passwords match nahi karte.", true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";

      try {
        const { error } = await db.auth.updateUser({ password: newPass });

        if (error) {
          const text = String(error.message || "").toLowerCase();
          if (text.includes("different") || text.includes("same")) {
            showMessage("Naya password purane se alag hona chahiye.", true);
          } else {
            showMessage("Password nahi badla: " + error.message, true);
          }
          return;
        }

        form.style.display = "none";
        intro.textContent = "Aap ka password badal gaya hai.";
        showMessage("Ab naye password se login karein. Aap ko 3 second mein login page par bheja ja raha hai.", false);

        await db.auth.signOut();
        setTimeout(function () { window.location.href = "index.html"; }, 3000);
      } catch (err) {
        console.error(err);
        showMessage("Kuch masla aaya: " + err.message, true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";
      }
    });
  </script>
</body>
</html>
